{% extends "layout.html" %}

{% block title %}
    Add Cash
{% endblock %}

{% block main %}
    <form action="/addcash" method="post">
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="amount" placeholder="Amount in USD" type="number" min="1" step="0.01">
        </div>
        <button class="btn btn-success" type="submit">Deposit</button>
    </form>
{% endblock %}
